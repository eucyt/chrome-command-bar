name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Xvfb and the Python X11 bindings
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb python3-xlib python3-pil
      - name: Install Chrome for Testing
        run: |
          installed="$(npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome")"
          echo "$installed"
          echo "CHROME_PATH=$(echo "$installed" | tail -n 1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test/e2e/artifacts/
          if-no-files-found: ignore
