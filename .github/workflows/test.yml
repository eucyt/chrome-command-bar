name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Xvfb and the Python X11 bindings
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb python3-xlib python3-pil
      - name: Install Chrome for Testing
        run: |
          installed="$(npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome")"
          echo "$installed"
          echo "CHROME_PATH=$(echo "$installed" | tail -n 1 | cut -d' ' -f2-)" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test/e2e/artifacts/
          if-no-files-found: ignore

  release:
    # Merging a version bump is the whole release procedure: a version on main without a release gets one.
    if: github.event_name == 'push'
    needs: [unit, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check whether this version is already released
        id: version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release
        if: steps.version.outputs.pending == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run package
          (cd dist/yadokari && zip -r -q "../yadokari-$VERSION.zip" .)
          gh release create "v$VERSION" "dist/yadokari-$VERSION.zip" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
