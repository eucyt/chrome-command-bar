    <div id="backdrop">
      <div id="panel" role="dialog" aria-label="コマンドバー">
        <div id="input-row">
          <span id="prompt" aria-hidden="true"></span>
          <span id="scope" hidden></span>
          <input
            id="query"
            type="text"
            role="combobox"
            aria-expanded="true"
            aria-controls="results"
            aria-autocomplete="list"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="タブ・ブックマーク・履歴を検索、またはURLを入力"
            autofocus
          />
          <span id="tip" aria-hidden="true"><kbd>&gt;</kbd><span>コマンド</span></span>
        </div>
        <ul id="results" role="listbox" aria-label="検索結果"></ul>
        <div id="footer">
          <span id="origin" title="このバーを開いたページ"></span>
          <span id="hints"></span>
        </div>
      </div>
    </div>
    <script type="module" src="bar.js"></script>
  </body>
</html>
